<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMIS — Irrigation Management Information System</title>
<style>
  :root{--bg:#0a141d;--card:#13283a;--line:#1e3d55;--ink:#eaf3fb;--mut:#9fb8cc;--accent:#39b7e6;--accent2:#2bd4a7}
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{background:linear-gradient(180deg,#09121a,#0b1620 50%);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5}
  a{color:var(--accent)}
  .wrap{max-width:1080px;margin:0 auto;padding:0 18px}
  header.top{padding:26px 0 8px;text-align:center}
  .badge{display:inline-block;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);
    border:1px solid var(--line);border-radius:999px;padding:5px 12px;margin-bottom:12px}
  h1{font-size:26px;line-height:1.15;margin:0;font-weight:800}h1 span{color:var(--accent)}
  /* stage */
  .stage{margin:18px 0 0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#000;box-shadow:0 20px 60px #0007;position:relative}
  .slideimg{display:block;width:100%;height:auto;background:#06101a}
  .cap{background:linear-gradient(180deg,#0e2132,#0c1c2b);border-top:1px solid var(--line);padding:16px 20px}
  .cap .k{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .cap .num{font-size:12px;color:var(--accent2);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
  .cap h2{margin:0;font-size:20px}
  .cap p{margin:7px 0 0;color:var(--mut);font-size:15px;max-width:860px}
  /* controls */
  .ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 2px 0}
  .btn{background:var(--accent);color:#04121c;border:none;border-radius:10px;padding:11px 16px;font-weight:700;font-size:15px;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600}
  .btn:hover{filter:brightness(1.08)}
  .toggle{display:flex;align-items:center;gap:7px;color:var(--mut);font-size:13px;cursor:pointer;user-select:none;margin-left:auto}
  .dots{display:flex;gap:6px;flex-wrap:wrap;margin:14px 2px 34px}
  .dot{width:9px;height:9px;border-radius:50%;background:#1e3d55;cursor:pointer}
  .dot.on{background:var(--accent)}
  /* Q&A */
  .qa{background:linear-gradient(180deg,#102232,#0e1d2b);border:1px solid var(--line);border-radius:16px;padding:22px;margin:0 0 48px}
  .qa h2{margin:0 0 4px;font-size:20px}.pill{display:inline-block;background:#12304380;border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:12px;color:var(--accent2);margin-left:8px}
  .qa .hint{color:var(--mut);font-size:14px;margin:0 0 14px}
  .qa .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .qa input[type=text]{flex:1;min-width:200px;background:#0a1824;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:15px;outline:none}
  .qa input[type=text]:focus{border-color:var(--accent)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .chip{background:#0a1824;border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
  .chip:hover{border-color:var(--accent);color:var(--ink)}
  .ans{margin-top:16px;background:#0a1824;border:1px solid var(--line);border-radius:12px;padding:16px;display:none}
  .ans.show{display:block}.ans .txt{font-size:16px}.ans .meta{margin-top:10px;font-size:13px;color:var(--mut)}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .7s linear infinite;vertical-align:-3px}
  @keyframes s{to{transform:rotate(360deg)}}
  footer{border-top:1px solid var(--line);padding:20px 0 48px;color:var(--mut);font-size:13px;text-align:center}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="badge">Guided product tour</div>
  <h1><span>IMIS</span> — Irrigation Management Information System</h1>
</div></header>

<main class="wrap">
  <div class="stage">
    <img class="slideimg" id="img" alt="IMIS screen">
    <div class="cap">
      <div class="k"><span class="num" id="num">1 / 18</span><h2 id="title"></h2></div>
      <p id="narr"></p>
    </div>
  </div>
  <div class="ctrl">
    <button class="btn ghost" onclick="go(-1)">← Prev</button>
    <button class="btn" id="play" onclick="toggleTour()">▶ Play tour</button>
    <button class="btn ghost" onclick="go(1)">Next →</button>
    <label class="toggle"><input type="checkbox" id="voice" checked> 🔊 narrate aloud</label>
  </div>
  <div class="dots" id="dots"></div>

  <section class="qa" id="ask">
    <h2>Ask anything about IMIS <span class="pill">free · live</span></h2>
    <p class="hint">A free assistant answers any question about the system.</p>
    <div class="row">
      <input type="text" id="q" placeholder="e.g. How is a farmer's debt calculated?" autocomplete="off">
      <button class="btn" onclick="ask()">Ask</button>
      <label class="toggle" style="margin-left:0"><input type="checkbox" id="qvoice" checked> 🔊 read aloud</label>
    </div>
    <div class="chips" id="chips"></div>
    <div class="ans" id="ans"><div class="txt" id="anstxt"></div><div class="meta" id="ansmeta"></div></div>
  </section>
</main>

<footer><div class="wrap">IMIS — real system walkthrough · free assistant. <span id="brainstat"></span></div></footer>

<script>
const BRAIN="https://flour-tackle-illustrated-adelaide.trycloudflare.com";
const SLIDES=[
 {img:"slides/00-login.png",t:"What is IMIS, and why it matters",n:"This is IMIS — the Irrigation Management Information System of the Agency of Melioration and Irrigation of Tajikistan. It replaces paper and spreadsheets with one transparent platform that runs the entire irrigation water cycle: who receives water, how much, when, and how it is metered, billed and collected. Everyone — from a single farmer to the national agency — signs in by their own role and sees exactly what they are allowed to."},
 {img:"slides/01-dashboard.png",t:"Dashboard — the whole picture",n:"After signing in, each organization gets its own dashboard: registered accounts, water planned and delivered, the collection rate, outstanding debt and losses, plus the health of every service. It is the single place to understand, at a glance, how the whole system is performing today."},
 {img:"slides/02-structure.png",t:"Organization structure & hierarchy",n:"Water management is organized as a hierarchy — water-user associations under district authorities, under basin authorities and the national agency. IMIS holds this full structure of 164 organizations, so plans and actual figures roll up automatically from a single plot all the way to the national level."},
 {img:"slides/03-users.png",t:"Water users & associations",n:"Every farm and water user is registered here with its plots, area and crops, managed by its association. This registry is the foundation of everything — planning, delivery and billing all start from who the water users are and what they farm."},
 {img:"slides/04-plots.png",t:"Plots, crops & areas",n:"For each plot IMIS records the crop and the exact area. The crop, together with the plot's hydromodule zone, sets the water norm — how much water that land needs — which is what drives the irrigation plan."},
 {img:"slides/05-map.png",t:"GIS map & layers",n:"The reservoir, canals, gates and plots appear as live layers on a GIS map over satellite imagery. Plots are coloured by crop, so an operator sees the whole irrigation network geographically and can click straight to any plot."},
 {img:"slides/06-requests.png",t:"Water requests & planning",n:"When a water user needs water, they create a request. IMIS turns it into a plan — an invoice in 'plan' status with zero debt for now. Nothing is charged yet; the request simply enters the delivery schedule."},
 {img:"slides/07-hydromodule.png",t:"Irrigation plan & hydromodule norms",n:"The plan is built per plot: the district water norm for the crop multiplied by the plot's area, decade by decade through the season, using the norms of the plot's hydromodule zone. This is how IMIS turns crops and areas into a precise, fair watering schedule."},
 {img:"slides/08-readings.png",t:"Meter readings & acceptance act",n:"When water is actually delivered, the volume is recorded by meter readings — entered manually or captured from sensors. These readings produce the water-acceptance act: the official record of how much water each user really received."},
 {img:"slides/09-dispatching.png",t:"Dispatching & water balance",n:"Dispatchers see the daily distribution of water per canal — planned versus actual — so any shortfall shows up immediately. Together with the water balance, this reveals where water is lost between the source and the field."},
 {img:"slides/10-billing.png",t:"Billing — charges & debt",n:"Debt is created only after the acceptance act, never from an estimate: the charge equals the actual metered volume multiplied by the tariff. You see total charged, paid and outstanding debt, and every bill posts to the water user's personal account."},
 {img:"slides/11-payments.png",t:"Payments, personal accounts & debt",n:"Water users pay through the bank using their personal account number. IMIS reconciles those payments automatically, tracks who still owes money, and keeps every personal account correct — including corrections and reversals when a reading is fixed."},
 {img:"slides/12-reports.png",t:"Reports & analytics",n:"All of this becomes reports: plan versus fact, collection, losses and ten-day summaries, by organization and by water. They can be filtered and exported to Excel or PDF for the agency and its departments."},
 {img:"slides/13-audit.png",t:"Audit & security",n:"Every action in the system is recorded. IMIS keeps a full audit trail and supports recalculation and reversal, so balances always stay correct and every change can be traced — essential for public money and water."},
 {img:"slides/14-admin.png",t:"Administration",n:"Finally, administrators manage the whole system from one place: organizations, directories, tariffs, and the fine-grained permissions that decide exactly what each role can see and do."}
];
const SAMPLES=["How is a farmer's debt calculated?","Net vs gross norm — what's the difference?","How does the per-plot plan work?","When is the membership fee charged?","Can a charge be reversed?"];

let cur=0,timer=null;
const img=document.getElementById('img'),numEl=document.getElementById('num'),titleEl=document.getElementById('title'),narrEl=document.getElementById('narr');
const dotsEl=document.getElementById('dots');
SLIDES.forEach((_,i)=>{const d=document.createElement('div');d.className='dot';d.onclick=()=>{stop();show(i)};dotsEl.appendChild(d)});
function show(i){
  cur=(i+SLIDES.length)%SLIDES.length;const s=SLIDES[cur];
  img.src=s.img;titleEl.textContent=s.t;narrEl.textContent=s.n;numEl.textContent=(cur+1)+' / '+SLIDES.length;
  [...dotsEl.children].forEach((d,j)=>d.classList.toggle('on',j===cur));
  narrate(s.t+'. '+s.n);
}
function go(d){stop();show(cur+d)}
function narrate(t){
  if(!document.getElementById('voice').checked||!window.speechSynthesis)return;
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=1;
  const vs=speechSynthesis.getVoices();const v=vs.find(x=>/en(-|_)US/i.test(x.lang))||vs.find(x=>/^en/i.test(x.lang));if(v)u.voice=v;
  speechSynthesis.speak(u);
}
function toggleTour(){
  const b=document.getElementById('play');
  if(timer){stop();return;}
  b.textContent='⏸ Pause';
  // advance every ~6.5s, but wait while narration is still speaking
  timer=setInterval(()=>{ if(window.speechSynthesis&&document.getElementById('voice').checked&&speechSynthesis.speaking) return; show((cur+1)%SLIDES.length); },6500);
  show(cur);
}
function stop(){if(timer){clearInterval(timer);timer=null;document.getElementById('play').textContent='▶ Play tour';}if(window.speechSynthesis)speechSynthesis.cancel();}
show(0);

const chips=document.getElementById('chips');
SAMPLES.forEach(s=>{const c=document.createElement('span');c.className='chip';c.textContent=s;c.onclick=()=>{document.getElementById('q').value=s;ask()};chips.appendChild(c)});
function speakAns(t){if(!document.getElementById('qvoice').checked||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';const vs=speechSynthesis.getVoices();const v=vs.find(x=>/en(-|_)US/i.test(x.lang))||vs.find(x=>/^en/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u);}
async function ask(){
  const q=document.getElementById('q').value.trim();if(!q)return;stop();
  const ans=document.getElementById('ans'),txt=document.getElementById('anstxt'),meta=document.getElementById('ansmeta');
  ans.classList.add('show');txt.innerHTML='<span class="spin"></span> thinking…';meta.textContent='';
  try{const r=await fetch(BRAIN+"/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({q})});
    const d=await r.json();txt.textContent=d.answer||"(no answer)";meta.textContent=d.relevant===false?"off-topic — steering back to IMIS":"";speakAns(d.answer||"");
  }catch(e){txt.textContent="The assistant is unreachable right now. Please try again in a moment.";}
}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')ask()});
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{};
fetch(BRAIN+"/health").then(r=>r.json()).then(d=>{document.getElementById('brainstat').textContent=d&&d.ok?'· assistant online':'';}).catch(()=>{});
</script>
</body>
</html>
